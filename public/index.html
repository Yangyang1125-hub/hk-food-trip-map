<!doctype html>
<html lang="zh-Hans">
<head>

  <title>上海打卡 · 地点与路线</title>
  <style>
    :root{--blue:#1747b8;--blue2:#2563eb;--blue-pale:#eaf1ff;--ink:#17243b;--muted:#6d7b91;--paper:#f3f6fc;--card:#fff;--line:#e2e9f4;--shadow:0 12px 32px #183a7214}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:22px 26px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.brand{display:flex;gap:11px;align-items:center;font-weight:800;font-size:15px}.logo{width:40px;height:40px;border-radius:13px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;box-shadow:0 5px 12px #1747b830}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 13px;border-radius:11px;font-weight:700}.btn:hover{border-color:#b9c9e8}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.btn.primary:hover{background:#123d9f}.hero{display:flex;justify-content:space-between;align-items:end;margin:0 0 19px}.eyebrow{letter-spacing:.17em;color:var(--blue2);font-size:11px;font-weight:800}.hero h1{font-size:clamp(30px,4vw,44px);line-height:1.12;margin:7px 0 8px;letter-spacing:-.03em}.sub{color:var(--muted);margin:0}.pill{background:var(--blue-pale);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:750;color:var(--blue)}.layout{display:grid;grid-template-columns:minmax(340px,400px) 1fr;gap:17px;min-height:680px}.side{display:flex;flex-direction:column;gap:13px;min-width:0}.panel{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:0 4px 18px #183a7206}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}.section-head h2{font-size:15px;margin:0}.count{font-size:12px;color:var(--muted)}.search-form{display:flex;gap:7px}.search-form input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;outline:none}.search-form input:focus{border-color:#78a1f7;box-shadow:0 0 0 3px #2563eb19}.search-help{font-size:11px;color:var(--muted);margin:8px 2px 0}.results{display:none;margin-top:11px;max-height:260px;overflow:auto;border-top:1px solid var(--line)}.results.show{display:block}.result{padding:10px 2px;border-bottom:1px solid #edf1f7;display:flex;align-items:center;justify-content:space-between;gap:9px}.result-main{min-width:0}.result-name{font-size:13px;font-weight:750}.result-address{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.result .mini{flex:none}.mini{padding:6px 9px;border:1px solid #dbe5f5;border-radius:8px;background:#fff;color:var(--blue);font-size:11px;font-weight:700}.mini:hover{background:var(--blue-pale)}.mini.delete{color:#a34c56;border-color:#f0dfe1}.place-list{overflow:auto;max-height:330px}.empty{padding:19px 12px;text-align:center;color:var(--muted);font-size:12px;background:#f8faff;border-radius:11px}.place{border-top:1px solid #edf1f7;padding:11px 1px}.place:first-child{border-top:0}.place-row{display:flex;align-items:start;gap:9px}.place-select{width:26px;height:26px;flex:none;border-radius:9px;background:var(--blue-pale);color:var(--blue);font-size:12px;font-weight:800;display:grid;place-items:center;cursor:pointer}.place-select.selected{background:var(--blue);color:#fff}.place-body{min-width:0;flex:1;cursor:pointer}.place-name{font-size:13px;font-weight:750}.place-meta{font-size:11px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}.place-note{font-size:11px;color:#536680;margin-top:4px}.place-actions{display:flex;gap:6px;margin:7px 0 0 35px}.route-controls{display:flex;gap:7px}.route-controls select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:white;padding:9px 8px;color:var(--ink)}.route-controls .btn{padding:8px 10px;white-space:nowrap}.route-hint{font-size:11px;color:var(--muted);margin:8px 1px 0}.route-info{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:11px}.route-info.show{display:block}.route-summary{font-size:12px;color:var(--blue);font-weight:750;margin-bottom:7px}.route-steps{padding:0 0 0 21px;margin:0;max-height:230px;overflow:auto}.route-steps li{padding:5px 0 5px 2px;font-size:11px;color:#41516a}.route-steps li::marker{color:var(--blue);font-weight:800}.map-panel{position:relative;min-height:650px;border-radius:19px;overflow:hidden;border:1px solid #d8e3f3;box-shadow:var(--shadow);background:#e7effc}.map-head{position:absolute;z-index:10;left:14px;right:14px;top:13px;display:flex;justify-content:space-between;align-items:start;pointer-events:none}.map-label,.map-tools{pointer-events:auto;background:#ffffffed;backdrop-filter:blur(9px);border:1px solid #fff;border-radius:12px;padding:9px 12px;box-shadow:0 4px 15px #142d5715}.map-label{font-weight:800;font-size:12px}.map-tools{display:flex;align-items:center;gap:7px}.map-tools .btn{padding:7px 10px;font-size:12px}.map-tools select{border:1px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff;font-size:12px;color:var(--ink)}#map{height:100%;min-height:650px}.map-pick-note{position:absolute;z-index:10;bottom:13px;left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:10px;background:#1747b8;color:#fff;font-size:12px;display:none;white-space:nowrap;box-shadow:var(--shadow)}.map-pick-note.show{display:block}.footer{display:flex;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:11px}.overlay{position:fixed;inset:0;z-index:1000;background:#13213a99;display:none;align-items:center;justify-content:center;padding:16px}.overlay.show{display:flex}.modal{background:#fff;border-radius:17px;padding:21px;width:min(460px,100%);box-shadow:0 24px 70px #0003}.modal h3{margin:0 0 14px;font-size:19px}.field{display:grid;gap:5px;margin:10px 0}.field label{font-size:12px;color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;outline:none}.field textarea{resize:vertical;min-height:58px}.modal-actions{display:flex;justify-content:end;gap:8px;margin-top:15px}.toast{position:fixed;z-index:1100;bottom:22px;left:50%;transform:translate(-50%,18px);opacity:0;transition:.2s;background:#17243b;color:white;border-radius:10px;padding:10px 15px;font-size:12px;pointer-events:none;max-width:calc(100% - 24px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.map-picking #map{cursor:crosshair}@media(max-width:900px){.shell{padding:15px}.layout{grid-template-columns:1fr}.map-panel{grid-row:1;min-height:55vh}#map{min-height:55vh}.place-list{max-height:340px}.side{display:grid;grid-template-columns:1fr 1fr;align-items:start}.side .panel:first-child,.side .panel:nth-child(3){grid-column:1/-1}}@media(max-width:560px){.shell{padding:11px}.top{margin-bottom:15px}.top-actions{gap:4px}.top-actions .btn{font-size:11px;padding:7px 8px}.hero{align-items:start;gap:8px;flex-direction:column}.layout{gap:11px}.side{display:flex}.map-panel,#map{min-height:52vh}.map-head{left:8px;right:8px;top:8px}.map-label{padding:8px;font-size:11px}.map-tools{gap:4px;padding:5px}.map-tools select,.map-tools .btn{font-size:10px;padding:6px}.footer{flex-direction:column}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top">
      <div class="brand"><div class="logo">沪</div><span>上海打卡</span></div>
      <div class="top-actions"><button class="btn" id="exportBtn">导出备份</button><button class="btn primary" id="shareBtn">分享地点 ↗</button></div>
    </header>
    <section class="hero">
      <div><div class="eyebrow">SHANGHAI · MY PLACES</div><h1>上海打卡</h1><p class="sub">搜地点、收藏灵感，在地图上串起你的上海路线。</p></div>
      <span class="pill">📍 上海 · 随时添加</span>
    </section>
    <div class="layout">
      <aside class="side">
        <section class="panel">
          <div class="section-head"><h2>搜索地点</h2><span class="count">高德地图</span></div>
          <form class="search-form" id="searchForm"><input id="searchInput" placeholder="搜店名、景点或地址" autocomplete="off"><button class="btn primary" type="submit">搜索</button></form>
          <div class="search-help">在页面内搜索上海地点，点“收藏”加入地图。</div>
          <div class="results" id="searchResults"></div>
        </section>
        <section class="panel">
          <div class="section-head"><h2>我的地点</h2><span class="count" id="placeCount">0 个地点</span></div>
          <div class="place-list" id="placeList"><div class="empty">搜索一个地点并收藏，它就会出现在地图上。</div></div>
          <div class="place-actions" style="margin:10px 0 0"><button class="mini" id="mapPickBtn" type="button">＋ 地图选点收藏</button></div>
        </section>
        <section class="panel">
          <div class="section-head"><h2>地点间路线</h2><span class="count">选择两个地点</span></div>
          <div class="route-controls"><select id="routeMode" aria-label="出行方式"><option value="walking">步行</option><option value="transit">公交 / 地铁</option><option value="driving">驾车</option></select><button class="btn primary" id="routeBtn" type="button">规划路线</button><button class="btn" id="clearRoute" type="button">清除</button></div>
          <div class="route-hint">点击地点前的编号选择起点和终点，路线会画在地图上。</div>
          <div class="route-info" id="routeInfo"><div class="route-summary" id="routeSummary"></div><ol class="route-steps" id="routeSteps"></ol></div>
        </section>
      </aside>
      <section class="map-panel" id="mapPanel">
        <div class="map-head"><div class="map-label">📍 上海地图</div><div class="map-tools"><button class="btn" id="fitBtn" type="button">显示全部地点</button></div></div>
        <div id="map"></div><div class="map-pick-note" id="mapPickNote">点击地图上的位置添加地点</div>
      </section>
    </div>
    <div class="footer"><span>地图 © 高德地图 · 搜索和路线规划在页面内完成</span><span>地点保存在当前浏览器；分享链接包含当前地点列表。</span></div>
  </main>
  <div class="overlay" id="overlay"><div class="modal"><h3 id="modalTitle">收藏地点</h3><form id="placeForm"><input type="hidden" id="editId"><input type="hidden" id="poiId"><input type="hidden" id="lat"><input type="hidden" id="lon"><div class="field"><label for="name">地点名称</label><input id="name" required></div><div class="field"><label for="address">地址</label><input id="address" required></div><div class="field"><label for="category">分类</label><select id="category"><option>地点</option><option>景点</option><option>餐饮</option><option>购物</option><option>住宿</option><option>休闲</option><option>其他</option></select></div><div class="field"><label for="note">备注</label><textarea id="note" placeholder="想做什么、攻略链接或其他提醒"></textarea></div><div class="modal-actions"><button type="button" class="btn" id="cancelBtn">取消</button><button type="submit" class="btn primary">保存地点</button></div></form></div></div>
  <div class="toast" id="toast"></div>
  <script src="/amap-config.js"></script>
  <script>
  (()=>{
    const SHANGHAI=[121.4737,31.2304], STORAGE_KEY='shanghai-check-in-v1';
    const $=id=>document.getElementById(id);
    const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    let map,placeSearch,places=[],selected=[],markers=new Map(),routePlanner=null,pickOnMap=false,searchResults=[],routeEndpoints='';
    function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
    function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(places))}
    function getPoint(poi){const point=poi?.location;if(!point)return{};if(typeof point.getLng==='function')return{lon:point.getLng(),lat:point.getLat()};return{lon:Number(point.lng??point[0]),lat:Number(point.lat??point[1])}}
    function pointInShanghai(p){return Number.isFinite(+p.lon)&&Number.isFinite(+p.lat)&&+p.lon>120&&+p.lon<123&&+p.lat>30&&+p.lat<32}
    function load(){try{const shared=location.hash.match(/trip=([^&]+)/),stored=shared?JSON.parse(decodeURIComponent(escape(atob(shared[1])))):JSON.parse(localStorage.getItem(STORAGE_KEY)||localStorage.getItem('hk-food-trip-2026')||'[]');places=(Array.isArray(stored)?stored:[]).filter(pointInShanghai).map(p=>({id:p.id||crypto.randomUUID(),poiId:p.poiId||'',name:p.name||'未命名地点',address:p.address||'上海',category:p.category||'其他',note:p.note||'',lon:+p.lon,lat:+p.lat}));if(shared)localStorage.setItem(STORAGE_KEY,JSON.stringify(places))}catch{places=[]}}
    function initMap(){map=new AMap.Map('map',{zoom:12,center:SHANGHAI,viewMode:'2D'});map.addControl(new AMap.ToolBar({position:'RB'}));map.on('click',ev=>{if(!pickOnMap)return;pickOnMap=false;$('mapPanel').classList.remove('map-picking');$('mapPickNote').classList.remove('show');openModal({name:$('searchInput').value.trim(),address:'上海（请补充详细地址）',lon:ev.lnglat.getLng(),lat:ev.lnglat.getLat()})});AMap.plugin(['AMap.PlaceSearch','AMap.Walking','AMap.Transfer','AMap.Driving'],()=>{placeSearch=new AMap.PlaceSearch({city:'上海市',citylimit:true,pageSize:10,extensions:'all',autoFitView:false});renderPlaces(true)})}
    function renderPlaces(fit=false){if(!map)return;for(const marker of markers.values())marker.setMap(null);markers.clear();$('placeCount').textContent=`${places.length} 个地点`;$('placeList').innerHTML=places.length?places.map((p,i)=>{const order=selected.indexOf(p.id),tag=order===0?'起点':order===1?'终点':'';return `<article class="place" data-id="${safe(p.id)}"><div class="place-row"><button class="place-select ${order>=0?'selected':''}" data-action="select" data-id="${safe(p.id)}" title="选择路线${tag?'（'+tag+'）':''}">${order>=0?order+1:i+1}</button><div class="place-body" data-action="focus" data-id="${safe(p.id)}"><div class="place-name">${safe(p.name)} ${tag?`<span class="count">· ${tag}</span>`:''}</div><div class="place-meta">${safe(p.category||'其他')} · ${safe(p.address)}</div>${p.note?`<div class="place-note">${safe(p.note)}</div>`:''}</div></div><div class="place-actions"><button class="mini" data-action="edit" data-id="${safe(p.id)}">编辑</button><button class="mini delete" data-action="delete" data-id="${safe(p.id)}">删除</button></div></article>`}).join(''):'<div class="empty">搜索一个地点并收藏，它就会出现在地图上。</div>';places.forEach((p,i)=>{if(!pointInShanghai(p))return;const n=selected.indexOf(p.id),marker=new AMap.Marker({position:[p.lon,p.lat],title:p.name,content:`<div style="width:30px;height:30px;border:2px solid #fff;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:${n>=0?'#1747b8':'#3478f6'};box-shadow:0 2px 8px #142d5740;display:grid;place-items:center;color:white;font:bold 12px Arial"><span style="transform:rotate(45deg)">${n>=0?n+1:i+1}</span></div>`,offset:new AMap.Pixel(-15,-28)});marker.setMap(map);marker.on('click',()=>{selectPlace(p.id);map.setZoomAndCenter(16,[p.lon,p.lat])});markers.set(p.id,marker)});if(fit&&markers.size)map.setFitView([...markers.values()],false,[95,70,70,70],16)}
    function selectPlace(id){if(selected.includes(id))selected=selected.filter(x=>x!==id);else{if(selected.length===2)selected.shift();selected.push(id)}renderPlaces(false);if(selected.length===2)toast('已选好起点和终点，点击“规划路线”')}
    function openModal(p={},existing=false){$('modalTitle').textContent=existing?'编辑地点':'收藏地点';$('editId').value=existing?p.id||'':'';$('poiId').value=p.poiId||'';$('lat').value=p.lat??'';$('lon').value=p.lon??'';$('name').value=p.name||'';$('address').value=p.address||'';$('category').value=p.category||'景点';$('note').value=p.note||'';$('overlay').classList.add('show')}
    function closeModal(){$('overlay').classList.remove('show')}
    function showResults(message){const box=$('searchResults');box.innerHTML=`<div class="search-help">${safe(message)}</div>`;box.classList.add('show')}
    $('searchForm').addEventListener('submit',e=>{e.preventDefault();const query=$('searchInput').value.trim();if(!query)return;if(!placeSearch){toast('地图搜索服务正在加载，请稍后再试');return}showResults('正在搜索上海地点…');placeSearch.search(query,(status,result)=>{const box=$('searchResults');if(status!=='complete'||!result.poiList?.pois?.length){showResults(result?.info==='OK'?'没有找到结果，试试更短的店名或关键词。':`搜索失败：${result?.info||'请稍后重试'}`);return}searchResults=result.poiList.pois;box.innerHTML=searchResults.map((p,i)=>`<div class="result"><div class="result-main"><div class="result-name">${safe(p.name)}</div><div class="result-address">${safe(p.address||p.pname||'上海')}</div></div><button type="button" class="mini" data-save-result="${i}">收藏</button></div>`).join('');box.classList.add('show')})});
    $('searchResults').addEventListener('click',e=>{const button=e.target.closest('[data-save-result]');if(!button)return;const poi=searchResults[Number(button.dataset.saveResult)];if(!poi)return;const pos=getPoint(poi);if(!pointInShanghai(pos)){toast('这个结果暂不在上海范围内');return}map.setZoomAndCenter(16,[pos.lon,pos.lat]);openModal({poiId:poi.id,name:poi.name,address:poi.address||poi.pname||'上海',...pos})});
    $('placeForm').addEventListener('submit',e=>{e.preventDefault();const editId=$('editId').value,old=places.find(p=>p.id===editId),p={id:editId||crypto.randomUUID(),poiId:$('poiId').value||'',name:$('name').value.trim(),address:$('address').value.trim(),category:$('category').value,note:$('note').value.trim(),lon:Number($('lon').value),lat:Number($('lat').value)};if(!p.name||!p.address||!pointInShanghai(p)){toast('请确认名称、地址和上海范围内的地图位置');return}if(editId)places=places.map(x=>x.id===editId?p:x);else places.push(p);save();renderPlaces(!editId);closeModal();$('searchResults').classList.remove('show');$('searchInput').value='';toast(editId?'地点已更新':'已收藏到上海打卡')});
    $('cancelBtn').onclick=closeModal;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))closeModal()});
    $('placeList').addEventListener('click',e=>{const button=e.target.closest('[data-action]');if(!button)return;const p=places.find(x=>x.id===button.dataset.id);if(!p)return;const action=button.dataset.action;if(action==='select')selectPlace(p.id);if(action==='focus')map.setZoomAndCenter(16,[p.lon,p.lat]);if(action==='edit')openModal(p,true);if(action==='delete'){places=places.filter(x=>x.id!==p.id);selected=selected.filter(x=>x!==p.id);save();renderPlaces(false);toast('地点已删除')}});
    $('mapPickBtn').onclick=()=>{pickOnMap=!pickOnMap;$('mapPanel').classList.toggle('map-picking',pickOnMap);$('mapPickNote').classList.toggle('show',pickOnMap);toast(pickOnMap?'请点击地图上要收藏的位置':'已退出地图选点')};
    function clearRoute(){if(routePlanner){routePlanner.clear();routePlanner=null}$('routeInfo').classList.remove('show');$('routeSummary').textContent='';$('routeSteps').innerHTML=''}
    $('routeBtn').onclick=()=>{if(selected.length!==2){toast('请先选择两个地点：第一个为起点，第二个为终点');return}const start=places.find(p=>p.id===selected[0]),end=places.find(p=>p.id===selected[1]);if(!start||!end)return;clearRoute();routeEndpoints=`${start.name} → ${end.name}`;$('routeInfo').classList.add('show');$('routeSummary').textContent=`正在规划：${routeEndpoints}`;const mode=$('routeMode').value,from=new AMap.LngLat(start.lon,start.lat),to=new AMap.LngLat(end.lon,end.lat),done=(status,result)=>{if(status!=='complete'){ $('routeSummary').textContent=`路线规划失败：${result?.info||'请尝试其他出行方式'}`;return}if(mode==='transit')renderTransit(result);else renderRoadRoute(result,mode)};if(mode==='walking'){routePlanner=new AMap.Walking({map,hideMarkers:true});routePlanner.search(from,to,done)}else if(mode==='driving'){routePlanner=new AMap.Driving({map,hideMarkers:true,showTraffic:false});routePlanner.search(from,to,done)}else{routePlanner=new AMap.Transfer({map,city:'上海市',cityd:'上海市',policy:AMap.TransferPolicy.LEAST_TIME});routePlanner.search(from,to,done)}};
    function formatDistance(value){const meters=Number(value)||0;return meters>=1000?`${(meters/1000).toFixed(1)} 公里`:`${Math.round(meters)} 米`}
    function renderRoadRoute(result,mode){const route=result.routes?.[0];if(!route){$('routeSummary').textContent='没有找到路线。';return}const steps=route.steps||[];$('routeSummary').textContent=`${routeEndpoints} · ${mode==='walking'?'步行':'驾车'} · ${formatDistance(route.distance)} · 约 ${Math.max(1,Math.round((Number(route.time)||0)/60))} 分钟 · 共 ${steps.length} 段`;$('routeSteps').innerHTML=steps.length?steps.map((step,i)=>`<li>${safe(step.instruction||step.action||step.road||`继续前行 ${formatDistance(step.distance)}`)}${step.distance?` <span class="count">(${formatDistance(step.distance)})</span>`:''}</li>`).join(''):'<li>路线已显示在地图上。</li>'}
    function renderTransit(result){const plan=result.plans?.[0];if(!plan){$('routeSummary').textContent='没有找到公交 / 地铁方案。';return}const segments=plan.segments||[],steps=[];segments.forEach(segment=>{if(segment.walking?.distance)steps.push(`步行 ${formatDistance(segment.walking.distance)} 到乘车点`);const transit=segment.transit||{};for(const line of transit.buslines||[]){const from=line.departure_stop?.name,to=line.arrival_stop?.name;steps.push(`${line.name||'公交 / 地铁'}${from&&to?`：${from} → ${to}`:''}`)}});$('routeSummary').textContent=`${routeEndpoints} · 公交 / 地铁 · ${formatDistance(plan.distance)} · 约 ${Math.max(1,Math.round((Number(plan.time)||0)/60))} 分钟 · ${segments.length} 段`;$('routeSteps').innerHTML=steps.length?steps.map(step=>`<li>${safe(step)}</li>`).join(''):'<li>换乘方案已显示在地图上。</li>'}
    $('clearRoute').onclick=()=>{selected=[];clearRoute();renderPlaces(false)};$('fitBtn').onclick=()=>{if(markers.size)map.setFitView([...markers.values()],false,[95,70,70,70],16);else map.setZoomAndCenter(12,SHANGHAI)};
    $('shareBtn').onclick=async()=>{const url=location.href.split('#')[0]+'#trip='+btoa(unescape(encodeURIComponent(JSON.stringify(places))));try{await navigator.clipboard.writeText(url);toast('分享链接已复制')}catch{prompt('复制分享链接：',url)}};
    $('exportBtn').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(places,null,2)],{type:'application/json'}));a.download='上海打卡地点备份.json';a.click();URL.revokeObjectURL(a.href)};
    load();if(!window.AMAP_KEY){toast('高德地图配置尚未完成')}else{window._AMapSecurityConfig=window._AMapSecurityConfig||{};const script=document.createElement('script');script.src=`https://webapi.amap.com/maps?v=2.0&key=${encodeURIComponent(window.AMAP_KEY)}&plugin=AMap.PlaceSearch,AMap.Walking,AMap.Transfer,AMap.Driving`;script.onload=initMap;script.onerror=()=>toast('地图加载失败，请检查高德 Key 配置');document.head.appendChild(script)}
  })();
  </script>
</body>
</html>
